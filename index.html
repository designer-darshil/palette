<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090A0C" />
    <title>KROMA — The Definitive Editorial Color &amp; Palette Library</title>
    <meta name="description" content="A curated digital color library, modernist palette catalogue, WCAG AAA harmony pairings, and CSS gradient specimens for designers and digital architects." />
    <link rel="canonical" href="https://kroma.design/" />
    
    <!-- Open Graph Default Fallbacks -->
    <meta property="og:site_name" content="KROMA" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KROMA — The Definitive Editorial Color &amp; Palette Library" />
    <meta property="og:description" content="A curated digital color library, modernist palette catalogue, WCAG AAA harmony pairings, and CSS gradient specimens for designers and digital architects." />
    <meta property="og:url" content="https://kroma.design/" />
    <meta property="og:image" content="https://kroma.design/og-kroma-preview.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Cards Default Fallbacks -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@kromacolors" />
    <meta name="twitter:title" content="KROMA — The Definitive Editorial Color &amp; Palette Library" />
    <meta name="twitter:description" content="A curated digital color library, modernist palette catalogue, WCAG AAA harmony pairings, and CSS gradient specimens for designers and digital architects." />
    <meta name="twitter:image" content="https://kroma.design/og-kroma-preview.png" />

    <!-- Performance & Font Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <!-- Pre-boot Theme Initialization to Prevent Flash of Wrong Theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kroma-theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <!-- Critical Boot Styles to Guarantee 0ms Flash Prevention and Instant Loader Visibility -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      :root {
        --loader-bg-light: #F8F8F8;
        --loader-outline-light: #171717;
        --loader-handle-light: #D9A77A;
        --loader-ferrule-light: #D0D0D4;

        --loader-bg-dark: #171717;
        --loader-outline-dark: #F8F8F8;
        --loader-handle-dark: #C99568;
        --loader-ferrule-dark: #3A3D45;

        --loader-bg: var(--loader-bg-dark);
        --loader-outline: var(--loader-outline-dark);
        --loader-handle: var(--loader-handle-dark);
        --loader-ferrule: var(--loader-ferrule-dark);
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background-color: #F7F8FA;
        color: #12141A;
        --loader-bg: var(--loader-bg-light);
        --loader-outline: var(--loader-outline-light);
        --loader-handle: var(--loader-handle-light);
        --loader-ferrule: var(--loader-ferrule-light);
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html:not([data-theme="light"]),
      html:not([data-theme="light"]) body {
        background-color: #090A0C;
        color: #F8F9FA;
        --loader-bg: var(--loader-bg-dark);
        --loader-outline: var(--loader-outline-dark);
        --loader-handle: var(--loader-handle-dark);
        --loader-ferrule: var(--loader-ferrule-dark);
      }
      body.kroma-locked {
        overflow: hidden !important;
      }
      #rainbow-boot-preloader {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        z-index: 999999;
        background-color: var(--loader-bg);
        color: var(--loader-outline);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-sizing: border-box;
        opacity: 1;
        visibility: visible;
        transition: opacity 500ms ease-out, visibility 500ms ease-out;
        pointer-events: all;
      }
      #rainbow-boot-preloader.rainbow-preloader-exit {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }
      .rainbow-roller-wrapper {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 68px;
        height: 68px;
        transform: translate(-50%, -50%) rotate(45deg);
        transform-origin: center center;
        pointer-events: none;
      }
      .rainbow-roller-svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      /* Layer 1: Roller Assembly (Main rocking & subtle ±1px displacement around axle) */
      .roller-assembly {
        transform-box: fill-box;
        transform-origin: 43px 40px;
        animation: rollerAssemblyRock 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes rollerAssemblyRock {
        0% {
          transform: translateX(-1px) rotate(-8deg);
        }
        25% {
          transform: translateX(0px) rotate(0deg);
        }
        50% {
          transform: translateX(1px) rotate(8deg);
        }
        75% {
          transform: translateX(0px) rotate(0deg);
        }
        100% {
          transform: translateX(-1px) rotate(-8deg);
        }
      }
      /* Layer 2: Roller Cylinder (Physical rolling rotation around cylinder axle) */
      .roller-cylinder {
        transform-box: fill-box;
        transform-origin: 43px 40px;
        animation: rollerCylinderRoll 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes rollerCylinderRoll {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(12deg);
        }
        50% {
          transform: rotate(0deg);
        }
        75% {
          transform: rotate(-12deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
      /* Layer 3: Roller Frame & Handle (Physically attached to top axle pin, follows naturally) */
      .roller-frame {
        transform-box: fill-box;
        transform-origin: 43px 18px;
        animation: rollerFrameFollow 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes rollerFrameFollow {
        0% {
          transform: rotate(1.5deg);
        }
        25% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-1.5deg);
        }
        75% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(1.5deg);
        }
      }
      @media (max-width: 768px) {
        .rainbow-roller-wrapper {
          width: 58px;
          height: 58px;
        }
      }
      @media (max-width: 480px) {
        .rainbow-roller-wrapper {
          width: 50px;
          height: 50px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .roller-assembly,
        .roller-cylinder,
        .roller-frame {
          animation: none !important;
          transform: none !important;
        }
        .rainbow-roller-wrapper {
          transform: translate(-50%, -50%) rotate(45deg) !important;
        }
        #rainbow-boot-preloader {
          transition: opacity 400ms ease-out, visibility 400ms ease-out !important;
        }
      }
    </style>
  </head>
  <body class="kroma-locked">
    <!-- Immediate Minimal Rainbow Paint Roller Preloader (Frame 0 paint) -->
    <div id="rainbow-boot-preloader" role="status" aria-label="Loading..." aria-live="polite">
      <div class="rainbow-roller-wrapper">
        <svg
          viewBox="0 0 100 100"
          class="rainbow-roller-svg"
          xmlns="http://www.w3.org/2000/svg"
          preserveAspectRatio="xMidYMid meet"
          aria-hidden="true"
        >
          <defs>
            <clipPath id="bootRainbowCylinderClip">
              <rect x="33" y="18" width="20" height="44" rx="6" ry="6" />
            </clipPath>
          </defs>

          <!-- Roller Assembly (Main physical rocking & rolling around axle) -->
          <g class="roller-assembly" style="transform-origin: 43px 40px;">
            <!-- Roller Frame & Handle Layer (Firmly pinned at top axle pin 43, 18) -->
            <g class="roller-frame" style="transform-origin: 43px 18px;">
              <!-- Metal Wire Bracket -->
              <path
                d="M 43 19 L 43 14 C 43 11, 45 9, 48 9 L 60 9 C 63.5 9, 65.5 11, 65.5 14.5 L 65.5 39 C 65.5 42, 63.5 44, 61 45.5 L 59 47 C 58 47.7, 57.5 48.8, 57.5 50 L 57.5 55"
                fill="none"
                stroke="var(--loader-outline)"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <!-- Metal Ferrule Collar -->
              <rect
                x="55.5"
                y="55"
                width="4"
                height="3"
                rx="0.8"
                fill="var(--loader-ferrule)"
                stroke="var(--loader-outline)"
                stroke-width="1.2"
              />

              <!-- Wooden Handle -->
              <path
                d="M 55.5 58 L 54 75 C 53.5 81, 61.5 81, 61 75 L 59.5 58 Z"
                fill="var(--loader-handle)"
                stroke="var(--loader-outline)"
                stroke-width="1.4"
                stroke-linejoin="round"
              />
            </g>

            <!-- Roller Cylinder Layer (Performs physical rolling rotation around axle) -->
            <g class="roller-cylinder" style="transform-origin: 43px 40px;">
              <!-- Clipped Solid Rainbow Stripes -->
              <g clip-path="url(#bootRainbowCylinderClip)">
                <!-- 6. Purple (#7B2CBF) -->
                <path
                  d="M 31 16 L 55 16 L 55 25.5 C 48 27.5, 39 23.5, 31 25.5 Z"
                  fill="#7B2CBF"
                />
                <!-- 5. Blue / Cyan (#00AEEF) -->
                <path
                  d="M 31 25.5 C 39 23.5, 48 27.5, 55 25.5 L 55 33 C 48 35, 39 31, 31 33 Z"
                  fill="#00AEEF"
                />
                <!-- 4. Green (#34C759) -->
                <path
                  d="M 31 33 C 39 31, 48 35, 55 33 L 55 40.5 C 48 42.5, 39 38.5, 31 40.5 Z"
                  fill="#34C759"
                />
                <!-- 3. Yellow (#FFD60A) -->
                <path
                  d="M 31 40.5 C 39 38.5, 48 42.5, 55 40.5 L 55 48 C 48 50, 39 46, 31 48 Z"
                  fill="#FFD60A"
                />
                <!-- 2. Orange (#FF9500) -->
                <path
                  d="M 31 48 C 48 46, 48 50, 55 48 L 55 55.5 C 48 57.5, 39 53.5, 31 55.5 Z"
                  fill="#FF9500"
                />
                <!-- 1. Red (#FF3B30) -->
                <path
                  d="M 31 55.5 C 39 53.5, 48 57.5, 55 55.5 L 55 65 L 31 65 Z"
                  fill="#FF3B30"
                />
              </g>

              <!-- Organic Wave Separators -->
              <path
                d="M 33 25.5 C 40 23.8, 47 27.2, 53 25.5"
                fill="none"
                stroke="var(--loader-outline)"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <path
                d="M 33 33 C 40 31.3, 47 34.7, 53 33"
                fill="none"
                stroke="var(--loader-outline)"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <path
                d="M 33 40.5 C 40 38.8, 47 42.2, 53 40.5"
                fill="none"
                stroke="var(--loader-outline)"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <path
                d="M 33 48 C 40 46.3, 47 49.7, 53 48"
                fill="none"
                stroke="var(--loader-outline)"
                stroke-width="1.2"
                stroke-linecap="round"
              />
              <path
                d="M 33 55.5 C 40 53.8, 47 57.2, 53 55.5"
                fill="none"
                stroke="var(--loader-outline)"
                stroke-width="1.2"
                stroke-linecap="round"
              />

              <!-- Roller Outer Border -->
              <rect
                x="33"
                y="18"
                width="20"
                height="44"
                rx="6"
                ry="6"
                fill="none"
                stroke="var(--loader-outline)"
                stroke-width="1.4"
              />

              <!-- Top wire attachment pin -->
              <circle cx="43" cy="18" r="1.5" fill="var(--loader-outline)" />
            </g>
          </g>
        </svg>
      </div>
    </div>

    <!-- Minimal Preloader Dismiss Engine -->
    <script>
      (function() {
        var loader = document.getElementById('rainbow-boot-preloader');
        if (!loader) return;

        var dismissed = false;

        function completeLoader() {
          if (dismissed) return;
          dismissed = true;
          // Smooth 500ms fade-out (opacity: 1 -> 0)
          loader.classList.add('rainbow-preloader-exit');
          setTimeout(function() {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
            document.body.classList.remove('kroma-locked');
          }, 520);
        }

        // Global Rainbow Loader bridge
        window.__RAINBOW_LOADER_COMPLETE__ = completeLoader;

        // Auto-dismiss safety fallback
        setTimeout(function() {
          if (!dismissed) {
            completeLoader();
          }
        }, 1800);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
