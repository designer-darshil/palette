<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainbow Paint Roller Preloader — 700×400</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ECECEC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .preview-card {
      background: #FFFFFF;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .preview-title {
      font-size: 14px;
      font-weight: 700;
      color: #333338;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .preview-frame {
      width: 700px;
      height: 400px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #E0E0E0;
      background-color: #F8F8F8;
    }
    .preview-frame img,
    .preview-frame object {
      width: 100%;
      height: 100%;
      display: block;
    }
    .info {
      font-size: 12px;
      color: #777780;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="preview-card">
    <div class="preview-title">Minimal 2D Animated Rainbow Roller Preloader (700 × 400 SVG)</div>
    <div class="preview-frame">
      <object type="image/svg+xml" data="rainbow-roller-preloader.svg"></object>
    </div>
    <div class="info">
      Canvas: 700 × 400 px (#F8F8F8) · 45° angle · 1.4s ease-in-out rocking loop (10°)
    </div>
  </div>

  <div class="preview-card" style="margin-top: 24px;">
    <div class="preview-title">High-Resolution Reference Render (700 × 400 #F8F8F8)</div>
    <div class="preview-frame">
      <img src="rainbow-roller-preloader.jpg" alt="Minimal 2D rainbow roller preloader reference render" />
    </div>
    <div class="info">
      Clean off-white (#F8F8F8) · Hand-drawn vector aesthetic · Pure negative space
    </div>
  </div>
</body>
</html>
